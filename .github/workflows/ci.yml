name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Vayu.slnx

      # Libraries and tests use Any CPU. Vayu.Desktop (WinUI 3) defines its
      # own <Platforms>x86;x64;ARM64</Platforms> and is built separately
      # below with -p:Platform=x64 so its RuntimeIdentifier (win-x64 on the
      # runner) matches the chosen PlatformTarget.
      - name: Build libs and tests
        shell: bash
        run: |
          set -e
          find src tests -name '*.csproj' | sort | while read csproj; do
            echo "::group::build $csproj"
            dotnet build "$csproj" --configuration Debug --no-restore /warnaserror
            echo "::endgroup::"
          done

      - name: Build Vayu.Desktop (WinUI 3, x64)
        run: dotnet build apps/Vayu.Desktop/Vayu.Desktop.csproj --configuration Debug --no-restore /warnaserror -p:Platform=x64

      - name: Test
        shell: bash
        run: |
          set -e
          find tests -name '*.csproj' | sort | while read csproj; do
            name=$(basename "$csproj" .csproj)
            echo "::group::test $csproj"
            dotnet test "$csproj" --configuration Debug --no-build \
              --logger "trx;LogFileName=${name}-results.trx" \
              --collect:"XPlat Code Coverage"
            echo "::endgroup::"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: ignore

      - name: Format check
        run: dotnet format Vayu.slnx --verify-no-changes --severity warn
        continue-on-error: true
