name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-artifacts:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Vayu.slnx

      # Libraries and tests use Any CPU. Vayu.Desktop (WinUI 3) defines its
      # own <Platforms>x86;x64;ARM64</Platforms> and is built separately
      # below with -p:Platform=x64. Debug for now — Release trim/AOT for
      # the desktop app lands with the real MSIX packaging in Milestone 7.
      - name: Build libs and tests
        shell: bash
        run: |
          set -e
          find src tests -name '*.csproj' | sort | while read csproj; do
            echo "::group::build $csproj"
            dotnet build "$csproj" --configuration Debug --no-restore
            echo "::endgroup::"
          done

      - name: Build Vayu.Desktop (WinUI 3, x64)
        run: dotnet build apps/Vayu.Desktop/Vayu.Desktop.csproj --configuration Debug --no-restore -p:Platform=x64

      # Placeholder — actual MSIX + installer steps land with Milestone 7.
      - name: Stub artifact (until M7)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          "Vayu ${{ github.ref_name }}" | Out-File out/README.txt
          Get-FileHash out/README.txt -Algorithm SHA256 | Format-List | Out-File out/SHA256SUMS.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*
          generate_release_notes: true
